[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dem-terrain-studio"
version = "0.1.0"
description = "Turn DEM-derived height maps and color maps into studio-lit 3D terrain renders with Blender."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "ChenNan" }]
keywords = ["dem", "terrain", "blender", "gis", "rendering"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
geo = ["rasterio>=1.3", "numpy>=1.24"]

[project.scripts]
dem-terrain-studio = "dem_terrain_studio.cli:main"

[project.urls]
Homepage = "https://github.com/cher9lie/dem-terrain-studio"
Issues = "https://github.com/cher9lie/dem-terrain-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]
